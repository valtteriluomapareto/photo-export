name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.route.outputs.app }}
      website: ${{ steps.route.outputs.website }}
    steps:
      - name: Check out comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Test CI routing and reporting tools
        run: python3 -B -m unittest discover -s scripts/ci/tests -p 'test_ci_*.py'

      - name: Select validation areas
        id: route
        run: python3 -B scripts/ci/ci_routing.py route

  website-validation:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Prettier (check)
        run: npm run format:check
        working-directory: website

      - name: oxlint
        run: npm run lint
        working-directory: website

      - name: Validate website
        run: npm run validate
        working-directory: website

      - name: Test and check built website links
        run: |
          npm run test:links
          npm run check:links
        working-directory: website

  app-validation:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: |
          echo "::group::Xcode selection"
          echo "Selecting Xcode at /Applications/Xcode_16.2.app"
          sudo xcode-select -s /Applications/Xcode_16.2.app
          echo "Active Xcode path: $(xcode-select -p)"
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks 2>/dev/null | grep macosx
          echo "::endgroup::"

      - name: Install SwiftLint and swift-format
        run: |
          echo "::group::Tool installation"
          echo "Installing swiftlint and swift-format via Homebrew..."
          brew install swiftlint swift-format
          echo "SwiftLint version: $(swiftlint version)"
          echo "swift-format version: $(swift-format --version)"
          echo "::endgroup::"

      - name: SwiftLint
        run: |
          echo "Running SwiftLint in strict mode..."
          echo "Config: $(cat .swiftlint.yml | head -5)"
          swiftlint --strict
          echo "SwiftLint passed."

      - name: SwiftFormat (check)
        run: |
          echo "Running strict swift-format lint on photo-export/..."
          swift-format lint --strict --configuration .swift-format.json --recursive photo-export
          echo "swift-format lint passed."

      - name: Check read-only Photos access and guard self-tests
        run: |
          ./scripts/ci/test-guards.sh
          python3 scripts/ci/check-read-only-photos.py

      - name: Check project version consistency
        run: python3 scripts/ci/check-version.py

      - name: Check regression-gate symbols
        run: |
          echo "::group::Regression-gate symbol check"
          echo "Verifying that the six tests documented in"
          echo "docs/reference/architecture-conventions.md §Regression gates"
          echo "still exist under their documented names."
          ./scripts/ci/check-regression-gates.sh
          echo "::endgroup::"

      - name: Check destination-identity keying
        run: |
          echo "::group::Destination-identity keying guard"
          echo "Verifying per-destination state keys on the stable id, not fingerprint?.id"
          echo "(docs/reference/architecture-conventions.md §Destination identity)."
          ./scripts/ci/check-fingerprint-id-keying.sh
          echo "::endgroup::"

      - name: Build Debug
        run: |
          echo "::group::Debug build"
          echo "Building Debug configuration (CODE_SIGNING_ALLOWED=NO)..."
          set -o pipefail
          xcodebuild \
            -project photo-export.xcodeproj \
            -scheme "photo-export" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee debug-build.log | tail -200
          echo "Debug build succeeded."
          echo "::endgroup::"

      - name: Run Unit Tests (Debug, with coverage)
        id: unit-tests
        timeout-minutes: 15
        run: |
          echo "::group::Unit tests"
          echo "Running unit tests with code coverage enabled..."
          set -o pipefail
          # Retain full output; the failure step prints reasons outside this tail.
          xcodebuild \
            -project photo-export.xcodeproj \
            -scheme "photo-export" \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | tail -300
          echo "Unit tests passed."
          echo "Result bundle: $(du -sh TestResults.xcresult)"
          echo "::endgroup::"

      - name: Publish advisory app coverage
        if: always()
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
        run: >-
          python3 -B scripts/ci/coverage_summary.py
          --result-bundle TestResults.xcresult
          --source-root "$GITHUB_WORKSPACE/photo-export"
          --test-outcome "$TEST_OUTCOME"

      - name: Build Release
        run: |
          echo "::group::Release build"
          echo "Building Release configuration (CODE_SIGNING_ALLOWED=NO)..."
          set -o pipefail
          xcodebuild \
            -project photo-export.xcodeproj \
            -scheme "photo-export" \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee release-build.log | tail -20
          echo "Release build succeeded."
          echo "::endgroup::"

      # Temporary #237 CI evidence. Removed before the merge candidate.
      - name: Prove 30 consecutive preview iterations
        if: always()
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p preview-stress
          for iteration in {1..30}; do
            echo "PREVIEW_STRESS_START=$iteration"
            xcodebuild \
              -project photo-export.xcodeproj \
              -scheme "photo-export" \
              -destination 'platform=macOS' \
              '-only-testing:photo-exportTests/AssetDetailPreviewRevisionTests/mountedSameIDEditAndRevertRefreshPixelsWithoutBlanking(change:)' \
              CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath "preview-stress/$iteration.xcresult" \
              test-without-building 2>&1 | tee "preview-stress/$iteration.log" | tail -35
            xcrun xcresulttool get test-results tests --path "preview-stress/$iteration.xcresult" > "preview-stress/$iteration.json"
            python3 - "$iteration" <<'PYTHON'
          import json, pathlib, sys
          iteration = sys.argv[1]
          data = json.loads(pathlib.Path(f"preview-stress/{iteration}.json").read_text())
          def walk(node):
              if isinstance(node, dict):
                  yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)
          selected = [n for n in walk(data) if n.get("nodeType") == "Test Case" and
                      n.get("nodeIdentifier") == "AssetDetailPreviewRevisionTests/mountedSameIDEditAndRevertRefreshPixelsWithoutBlanking(change:)"]
          assert len(selected) == 1 and selected[0].get("result") == "Passed", selected
          arguments = [n for n in walk(selected[0]) if n.get("nodeType") == "Arguments"]
          assert len(arguments) == 4 and {n["name"] for n in arguments} == {".known", ".unknown", ".overflow", ".coalesced"}, arguments
          assert all(n.get("result") == "Passed" for n in arguments), arguments
          PYTHON
            echo "PREVIEW_STRESS_PASSED=$iteration CASES=4"
          done

      - name: Print build and test failure diagnostics
        if: failure()
        run: |
          for log in debug-build.log test.log release-build.log; do
            if [[ -f "$log" ]]; then
              echo "::group::Failure diagnostics: $log"
              grep -nE '✘|↳|recorded an issue|Expectation failed|error:' "$log" || true
              echo "::endgroup::"
            fi
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            debug-build.log
            test.log
            release-build.log
            preview-stress

  # Preserve the existing check name even when its expensive validator is skipped.
  website:
    needs: [changes, website-validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out result validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the expected validation result
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.website }}
          VALIDATION_RESULT: ${{ needs.website-validation.result }}
        run: python3 -B scripts/ci/ci_routing.py check "$ROUTING_RESULT" "$SELECTED" "$VALIDATION_RESULT"

  # Preserve the existing check name even when its expensive validator is skipped.
  build-and-test:
    needs: [changes, app-validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out result validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require the expected validation result
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.app }}
          VALIDATION_RESULT: ${{ needs.app-validation.result }}
        run: python3 -B scripts/ci/ci_routing.py check "$ROUTING_RESULT" "$SELECTED" "$VALIDATION_RESULT"
