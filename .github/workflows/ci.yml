name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Prettier (check)
        run: npm run format:check
        working-directory: website

      - name: oxlint
        run: npm run lint
        working-directory: website

      - name: Validate website
        run: npm run validate
        working-directory: website

      - name: Test and check built website links
        run: |
          npm run test:links
          npm run check:links
        working-directory: website

  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Install SwiftLint, swift-format, actionlint and ShellCheck
        run: bash scripts/ci/install-ci-tools.sh

      - name: SwiftLint
        run: |
          echo "Running SwiftLint in strict mode..."
          echo "Config: $(head -5 .swiftlint.yml)"
          swiftlint --strict
          echo "SwiftLint passed."

      - name: Run static guards
        run: bash scripts/ci/run-guards.sh

      # A Swift warning fails the merge gate. The release workflows build without this switch.
      - name: Build Debug
        env:
          SWIFT_WARNINGS_AS_ERRORS: "1"
        run: bash scripts/ci/build-app.sh Debug

      - name: Check xcresult diagnostics export support
        continue-on-error: true
        run: xcrun xcresulttool export diagnostics --help > /dev/null

      - name: Run Unit Tests (Debug, with coverage)
        id: unit-tests
        timeout-minutes: 15
        run: bash scripts/ci/run-unit-tests.sh

      - name: Check regression gates ran
        if: success()
        run: |
          echo "::group::Regression-gate result check"
          echo "Verifying that every gate in scripts/ci/regression-gates.txt ran in"
          echo "TestResults.xcresult and was not skipped, failed or an expected failure."
          xcrun xcresulttool version
          python3 -B scripts/ci/check-regression-gates-ran.py --result-bundle TestResults.xcresult
          echo "::endgroup::"

      - name: Publish advisory app coverage
        if: always()
        continue-on-error: true
        env:
          TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
        run: >-
          python3 -B scripts/ci/coverage_summary.py
          --result-bundle TestResults.xcresult
          --source-root "$GITHUB_WORKSPACE/photo-export"
          --test-outcome "$TEST_OUTCOME"

      - name: Build Release
        run: bash scripts/ci/build-app.sh Release

      - name: Check built Release app
        run: bash scripts/ci/check-built-app.sh

      - name: Print build and test failure diagnostics
        if: failure()
        run: bash scripts/ci/print-failure-diagnostics.sh

      - name: Collect test process diagnostics
        if: ${{ failure() && steps.unit-tests.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python3 -B scripts/ci/collect_test_diagnostics.py \
            --since test-start.marker \
            --result-bundle TestResults.xcresult \
            --output TestDiagnostics

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            debug-build.log
            debug-werror-build.log
            test.log
            release-build.log
            TestDiagnostics/
