name: Release (App Store)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build only — do not upload to App Store Connect'
        required: true
        default: true
        type: boolean

concurrency:
  group: release-app-store
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCHEME: photo-export
  PROJECT: photo-export.xcodeproj
  APP_NAME: "Photo Export"
  APPSTORE_BUNDLE_ID: com.valtteriluoma.photo-export-appstore

jobs:
  build-sign-upload:
    # Skip the App Store path for pre-release tags (e.g. v1.3.0-beta.1).
    # App Store Connect rejects hyphen-suffixed CFBundleShortVersionString,
    # so betas ship through the direct-distribution channel only.
    if: "!startsWith(github.ref, 'refs/tags/v') || !contains(github.ref, '-')"
    runs-on: macos-15
    environment: app-store-release
    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check project version consistency
        run: python3 scripts/ci/check-version.py

      - name: Determine build context
        id: ctx
        env:
          INPUT_SKIP_UPLOAD: ${{ github.event.inputs.skip_upload }}
        run: |
          echo "::group::Build context"
          IS_TAG="false"
          SHOULD_UPLOAD="false"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            IS_TAG="true"
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Version tag selected: v${VERSION}"
          fi

          # For non-tag runs, read version from project.pbxproj
          if [[ "${IS_TAG}" != "true" ]]; then
            VERSION=$(grep -m1 'MARKETING_VERSION' photo-export.xcodeproj/project.pbxproj | sed 's/.*= *\(.*\);/\1/')
            echo "Using MARKETING_VERSION from project: ${VERSION}"
          fi

          # Only an automatic tag push or an explicit manual opt-in may upload.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$IS_TAG" == "true" ]]; then
            SHOULD_UPLOAD="true"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${INPUT_SKIP_UPLOAD:-}" == "false" \
            && ( "$IS_TAG" == "true" || "$GITHUB_REF" == refs/heads/* ) ]]; then
            SHOULD_UPLOAD="true"
          fi
          # Branch dispatches can also contain a prerelease project version.
          if [[ "$VERSION" == *-* ]]; then
            SHOULD_UPLOAD="false"
          fi

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_upload=${SHOULD_UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Summary:"
          echo "  is_tag=${IS_TAG}"
          echo "  version=${VERSION}"
          echo "  build_number=${BUILD_NUMBER}"
          echo "  should_upload=${SHOULD_UPLOAD}"
          echo "::endgroup::"

      - name: Verify MARKETING_VERSION matches tag
        if: steps.ctx.outputs.is_tag == 'true'
        env:
          EXPECTED_TAG_VERSION: ${{ steps.ctx.outputs.version }}
        run: python3 scripts/ci/check-version.py --expected "$EXPECTED_TAG_VERSION"

      # ── Xcode selection ───────────────────────────────────────────────
      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      # ── Keychain & certificates ──────────────────────────────────────
      - name: Set up keychain and certificates
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: bash scripts/ci/setup-keychain-appstore.sh

      # ── Provisioning profile ─────────────────────────────────────────
      - name: Install provisioning profile
        env:
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/ci/install-provisioning-profile.sh

      # ── Archive ───────────────────────────────────────────────────────
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.ctx.outputs.build_number }}
        run: bash scripts/ci/archive-appstore.sh

      # ── Export ────────────────────────────────────────────────────────
      - name: Export
        run: bash scripts/ci/export-appstore.sh

      # ── Package artifact ──────────────────────────────────────────────
      - name: Prepare package
        env:
          VERSION: ${{ steps.ctx.outputs.version }}
          BUILD_NUMBER: ${{ steps.ctx.outputs.build_number }}
        run: bash scripts/ci/prepare-pkg.sh

      - name: Upload App Store pkg artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appstore-pkg
          path: ${{ env.PKG_PATH }}

      # ── Upload to App Store Connect ──────────────────────────────────
      - name: Upload to App Store Connect
        if: steps.ctx.outputs.should_upload == 'true'
        env:
          VERSION: ${{ steps.ctx.outputs.version }}
          BUILD_NUMBER: ${{ steps.ctx.outputs.build_number }}
          APP_STORE_APP_APPLE_ID: ${{ secrets.APP_STORE_APP_APPLE_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: bash scripts/ci/upload-appstore-connect.sh

      # ── Cleanup (always) ─────────────────────────────────────────────
      - name: Clean up
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: bash scripts/ci/cleanup-appstore.sh
