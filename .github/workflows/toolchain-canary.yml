name: Settings and collection diagnostics

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact diagnostic source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  hosted:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Validate source identifier
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out verification adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: adapter
          persist-credentials: false

      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          path: source
          persist-credentials: false

      - name: Prove source and toolchain
        working-directory: source
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
          ADAPTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/settings-diagnostics/settings" "$RUNNER_TEMP/settings-diagnostics/collection"
          {
            test "$(git rev-parse HEAD)" = "$TESTED_SHA"
            test -z "$(git status --porcelain)"
            printf 'Source SHA: %s\nAdapter SHA: %s\n' "$TESTED_SHA" "$ADAPTER_SHA"
            git rev-parse 'HEAD^{tree}'
            test "$(tr -d '[:space:]' < .xcode-version)" = 26.6
            bash scripts/ci/select-xcode.sh 26.6
            sw_vers
          } 2>&1 | tee "$RUNNER_TEMP/settings-diagnostics/provenance.log"

      - name: Run Settings control once
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/settings-diagnostics/settings"
          command=(caffeinate -du xcodebuild
            -project photo-export.xcodeproj -scheme photo-export
            -destination 'platform=macOS'
            -derivedDataPath "$RUNNER_TEMP/SettingsDiagnosticDerivedData"
            -resultBundlePath "$evidence/Results.xcresult"
            '-only-testing:photo-exportTests/ManualExportFeedbackViewTests/viewIssuesReselectsTheTabAfterAnotherOwnerChangesPreferences()'
            CODE_SIGNING_ALLOWED=NO test)
          printf '%q ' "${command[@]}" > "$evidence/command.txt"
          printf '\n' >> "$evidence/command.txt"
          "${command[@]}" 2>&1 | tee "$evidence/hosted.log" | tail -100

      - name: Require the exact single Settings pass
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/settings-diagnostics/settings"
          xcrun xcresulttool get test-results summary --path "$evidence/Results.xcresult" > "$evidence/summary.json"
          xcrun xcresulttool get test-results tests --path "$evidence/Results.xcresult" > "$evidence/tests.json"
          python3 - "$evidence" <<'PY'
          import json
          import sys
          from pathlib import Path
          folder = Path(sys.argv[1])
          summary = json.loads((folder / 'summary.json').read_text())
          tree = json.loads((folder / 'tests.json').read_text())
          expected = 'ManualExportFeedbackViewTests/viewIssuesReselectsTheTabAfterAnotherOwnerChangesPreferences()'
          assert summary['result'] == 'Passed' and summary['totalTestCount'] == 1, summary
          fields = {'passedTests': 1, 'expectedFailures': 0, 'failedTests': 0, 'skippedTests': 0}
          assert all(summary[k] == v for k, v in fields.items()), summary
          configurations = summary['devicesAndConfigurations']
          assert len(configurations) == 1, configurations
          assert all(configurations[0][k] == v for k, v in fields.items()), configurations
          cases = []
          def collect(node):
              if node['nodeType'] == 'Test Case':
                  cases.append(node)
              for child in node.get('children', []):
                  collect(child)
          for node in tree['testNodes']:
              collect(node)
          assert len(cases) == 1, cases
          assert cases[0]['nodeIdentifier'] == expected and cases[0]['result'] == 'Passed', cases
          result = {'testIdentifier': expected, 'executions': 1, 'result': 'Passed'}
          (folder / 'selection-check.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY

      - name: Run collection trace up to ten times
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/settings-diagnostics/collection"
          command=(caffeinate -du xcodebuild
            -project photo-export.xcodeproj -scheme photo-export
            -destination 'platform=macOS'
            -derivedDataPath "$RUNNER_TEMP/SettingsDiagnosticDerivedData"
            -resultBundlePath "$evidence/Results.xcresult"
            -test-iterations 10 -run-tests-until-failure
            '-only-testing:photo-exportTests/CollectionContentObservationTests/settingsRecordsMembershipAndLiveBindingStillRender()'
            CODE_SIGNING_ALLOWED=NO test)
          printf '%q ' "${command[@]}" > "$evidence/command.txt"
          printf '\n' >> "$evidence/command.txt"
          "${command[@]}" 2>&1 | tee "$evidence/hosted.log" | tail -100

      - name: Export result summaries and attachments
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export_failed=0
          for selection in settings collection; do
            evidence="$RUNNER_TEMP/settings-diagnostics/$selection"
            if [[ -d "$evidence/Results.xcresult" ]]; then
              summary_status=0
              xcrun xcresulttool get test-results summary --path "$evidence/Results.xcresult" \
                > "$evidence/summary.json" || summary_status=$?
              tests_status=0
              xcrun xcresulttool get test-results tests --path "$evidence/Results.xcresult" \
                > "$evidence/tests.json" || tests_status=$?
              attachments_status=0
              xcrun xcresulttool export attachments --path "$evidence/Results.xcresult" \
                --output-path "$evidence/measurements" > "$evidence/export.log" 2>&1 || attachments_status=$?
              printf 'summary_exit=%s\ntests_exit=%s\nattachments_exit=%s\n' \
                "$summary_status" "$tests_status" "$attachments_status" > "$evidence/export-status.txt"
              if (( summary_status != 0 || tests_status != 0 || attachments_status != 0 )); then
                export_failed=1
              fi
            fi
          done
          exit "$export_failed"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-bounded-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/settings-diagnostics/
          if-no-files-found: error
          retention-days: 14
