name: Observation hosted verification

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact source commit to validate
        required: true
        type: string
      evidence_label:
        description: Baseline or candidate evidence
        required: true
        type: choice
        options: [baseline, candidate]

permissions:
  contents: read

jobs:
  hosted:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Validate source identifier
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out verification adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: adapter
          persist-credentials: false

      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          path: source
          persist-credentials: false

      - name: Prove source and toolchain
        working-directory: source
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
          ADAPTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observation-evidence"
          {
            test "$(git rev-parse HEAD)" = "$TESTED_SHA"
            test -z "$(git status --porcelain)"
            printf 'Source SHA: %s\nAdapter SHA: %s\n' "$TESTED_SHA" "$ADAPTER_SHA"
            git rev-parse 'HEAD^{tree}'
            test "$(tr -d '[:space:]' < .xcode-version)" = 26.6
            bash scripts/ci/select-xcode.sh 26.6
            sw_vers
            shasum -a 256 ../adapter/observation-hosted-suites.txt
            cat ../adapter/observation-hosted-suites.txt
          } 2>&1 | tee "$RUNNER_TEMP/observation-evidence/provenance.log"

      - name: Run bridge probes once
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          selectors=()
          while IFS= read -r suite; do
            [[ -n "$suite" && "$suite" != \#* ]] || continue
            [[ "$suite" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]
            test -f "photo-exportTests/$suite.swift"
            selectors+=("-only-testing:photo-exportTests/$suite")
          done < ../adapter/observation-hosted-suites.txt
          test "${#selectors[@]}" -gt 0
          command=(caffeinate -du xcodebuild
            -project photo-export.xcodeproj -scheme photo-export
            -destination 'platform=macOS'
            -derivedDataPath "$RUNNER_TEMP/ObservationDerivedData"
            -resultBundlePath "$RUNNER_TEMP/observation-evidence/HostedResults.xcresult"
            "${selectors[@]}" CODE_SIGNING_ALLOWED=NO test)
          printf '%q ' "${command[@]}" > "$RUNNER_TEMP/observation-evidence/command.txt"
          printf '\n' >> "$RUNNER_TEMP/observation-evidence/command.txt"
          "${command[@]}" 2>&1 | tee "$RUNNER_TEMP/observation-evidence/hosted.log" | tail -300

      - name: Export result summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/observation-evidence/HostedResults.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result" \
              > "$RUNNER_TEMP/observation-evidence/summary.json"
            xcrun xcresulttool get test-results tests --path "$result" \
              > "$RUNNER_TEMP/observation-evidence/tests.json"
          fi

      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation-hosted-${{ inputs.evidence_label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/observation-evidence/
          if-no-files-found: error
          retention-days: 14
