# SwiftLint configuration (lenient baseline)
# See: https://github.com/realm/SwiftLint

included:
  - photo-export
excluded:
  - build
  - photo-export.xcodeproj
  - photo-export.xcodeproj/project.xcworkspace
  - photo-export.xcodeproj/xcshareddata

# Reporter suitable for Xcode/CI logs
reporter: "xcode"

# Rule tuning (keep CI green to start; tighten over time)
disabled_rules:
  - trailing_whitespace
  - force_cast
  - force_try
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - identifier_name
  - large_tuple
  - nesting
  - opening_brace
  - function_parameter_count
  - trailing_comma
  - closure_parameter_position

# Common thresholds
line_length:
  # CI runs SwiftLint with `--strict`, which upgrades warnings into hard
  # failures. Long user-facing UI copy (Text(...) prose, release notes)
  # routinely runs past 140 chars and isn't useful to break — so the
  # warning threshold is set well past any current prose line. The error
  # threshold still catches accidental no-wrap code blocks.
  warning: 500
  error: 700
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

# A couple of file-backed AutoSync stores have descriptive names just
# over the 40-char default (e.g. `FileBackedAutoSyncPerDestinationTokenStore`).
# Naming them shorter loses the file-backed/per-destination distinction
# the codebase relies on at call sites.
type_name:
  max_length:
    warning: 60
    error: 80
